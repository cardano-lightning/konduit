[package]
name = "cln-server"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
rust-version.workspace = true

[dependencies]
hex = { workspace = true, features = ["serde"] }
konduit-data = { workspace = true, features = ["serde"] }
minicbor.workspace = true
thiserror.workspace = true
web-time.workspace = true

serde = { workspace = true }
http-client = { workspace = true, features = [
  "cbor",
  "json",
  "reqwest",
], default-features = false }
rand.workspace = true
tracing.workspace = true
# Only `rt`, for `tokio::spawn`-ing the background squash dispatch: the
# reqwest transport above already requires an ambient tokio runtime at
# call time regardless, so this isn't a new runtime dependency, just the
# first spot cln-server's own code needs to name the crate directly. The
# fuller feature set (macros/rt-multi-thread/time) the standalone
# binaries and tests need is layered on below, under "standalone".
tokio = { workspace = true, features = ["rt"] }

anyhow = { workspace = true, optional = true }
actix-web = { workspace = true, optional = true }
clap = { workspace = true, optional = true, features = ["derive"] }
toml = { workspace = true, optional = true }
env_logger = { workspace = true, optional = true }
log = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true, features = ["json"] }
serde_json = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true, features = [
  "env-filter",
] }

[dev-dependencies]
tokio.workspace = true

[features]
default = ["standalone", "client", "server"]

# Shared by both binaries: CLI parsing, config loading, logging, async runtime.
standalone = [
  "dep:clap",
  "dep:toml",
  "dep:anyhow",
  "dep:env_logger",
  "dep:log",
  "tokio/macros",
  "tokio/rt-multi-thread",
  "tokio/time",
  "dep:tracing-subscriber",
]

server = ["standalone", "dep:actix-web", "dep:serde_json"]
client = ["standalone", "dep:reqwest", "dep:serde_json"]

[[bin]]
name = "cln-server"
path = "src/bin/server.rs"
required-features = ["server"]

[[bin]]
name = "cln-client"
path = "src/bin/client.rs"
required-features = ["client"]

[[example]]
name = "consumer_gateway_merchant"
required-features = ["server", "client"]
