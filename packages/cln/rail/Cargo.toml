[package]
name = "cln-rail"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
rust-version.workspace = true

[dependencies]
hex = { workspace = true, features = ["serde"] }
konduit-data = { workspace = true, features = ["serde"] }
konduit-rail.workspace = true
minicbor.workspace = true
thiserror.workspace = true
web-time.workspace = true

serde = { workspace = true }
http-client = { workspace = true, features = [
  "cbor",
  "json",
  "reqwest",
], default-features = false }
rand.workspace = true
tracing.workspace = true
# Only `rt`, for `tokio::spawn`-ing the background squash dispatch: the
# reqwest transport above already requires an ambient tokio runtime at
# call time regardless, so this isn't a new runtime dependency, just the
# first spot cln-rail's own code needs to name the crate directly. The
# fuller feature set (macros/rt-multi-thread/time) the `cln-client`
# binary and the tests need is layered on below, under "client".
tokio = { workspace = true, features = ["rt"] }

anyhow = { workspace = true, optional = true }
clap = { workspace = true, optional = true, features = ["derive"] }
toml = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true, features = ["json"] }
serde_json = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true, features = [
  "env-filter",
] }

[dev-dependencies]
tokio.workspace = true

[features]
default = ["client"]

# The `cln-client` binary: CLI parsing, config loading, tracing, async
# runtime, and the reqwest transport it pays over. The library itself needs
# none of it.
client = [
  "dep:clap",
  "dep:toml",
  "dep:anyhow",
  "dep:reqwest",
  "dep:serde_json",
  "dep:tracing-subscriber",
  "tokio/macros",
  "tokio/rt-multi-thread",
  "tokio/time",
]

[[bin]]
name = "cln-client"
path = "src/bin/client.rs"
required-features = ["client"]

[[example]]
name = "consumer_gateway_merchant"
required-features = ["client"]
