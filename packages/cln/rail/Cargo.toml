[package]
name = "cln-rail"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
rust-version.workspace = true

[dependencies]
hex = { workspace = true, features = ["serde"] }
konduit-data = { workspace = true, features = ["serde"] }
konduit-rail.workspace = true
konduit-tmp.workspace = true
serde_json.workspace = true
minicbor.workspace = true
thiserror.workspace = true
web-time.workspace = true

serde = { workspace = true }
http-client = { workspace = true, features = [
  "cbor",
  "json",
  "reqwest",
], default-features = false }
rand.workspace = true
tracing.workspace = true
# Only `rt`, for `tokio::spawn`-ing the background squash dispatch: the
# reqwest transport above already requires an ambient tokio runtime at
# call time regardless, so this isn't a new runtime dependency, just the
# first spot cln-rail's own code needs to name the crate directly. The
# fuller feature set (macros/rt-multi-thread/time) the tests need is
# layered on below, as a dev-dependency.
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
# For the config generator example and the tests; the library needs
# neither.
anyhow.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[[example]]
name = "consumer_gateway_merchant"
