openapi: 3.1.0
info:
  title: Cardano Connector Server API
  version: 1.0.0
  description: |
    Minimal HTTP facade over Blockfrost and Koios used by the Cardano connector client.

    The API is read-only except for transaction submission. Amounts are encoded as decimal strings
    to avoid integer precision issues in clients that do not support JSON bigint.
servers:
  - url: http://localhost:8787
    description: Local development server
  - url: https://api.ferret.channel
    description: Hosted Cloudflare worker for Ferret, configured for PreProd
paths:
  /health:
    get:
      summary: Health
      operationId: getHealth
      responses:
        "200":
          description: Service is reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /network:
    get:
      summary: Network
      operationId: getNetwork
      responses:
        "200":
          description: Network inferred from the configured Blockfrost project id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkResponse"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /balance/{address}:
    get:
      summary: Address balance
      operationId: getBalance
      parameters:
        - $ref: "#/components/parameters/Address"
      responses:
        "200":
          description: Lovelace balance for the address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceResponse"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /utxos_at/{address}:
    get:
      summary: UTxOs by address
      operationId: getUtxosAt
      parameters:
        - $ref: "#/components/parameters/Address"
      responses:
        "200":
          description: Current UTxOs found at the address
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Utxo"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /transactions/{address}:
    get:
      summary: Transactions by address
      operationId: getTransactions
      parameters:
        - $ref: "#/components/parameters/Address"
      responses:
        "200":
          description: Transactions touching the address
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TransactionSummary"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /transaction/{id}:
    get:
      summary: Transaction by id
      operationId: getTransaction
      parameters:
        - $ref: "#/components/parameters/TransactionId"
      responses:
        "200":
          description: Expanded transaction summary
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/TransactionSummary"
                  - type: "null"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /protocol-parameters:
    get:
      summary: Current protocol parameters and chain marker
      operationId: getProtocolParameters
      responses:
        "200":
          description: Current era parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtocolParametersResponse"

  /operations:
    post:
      summary: Submit an idempotent independent L1 transaction
      operationId: submitL1Operation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/L1OperationRequest"
      responses:
        "200":
          description: Operation recorded or submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/L1OperationResponse"
        "409":
          description: Operation ID was already used for different transaction bytes
        default:
          $ref: "#/components/responses/UnexpectedError"

  /operations/{operation_id}:
    get:
      summary: Reconcile an independent L1 operation
      operationId: getL1Operation
      parameters:
        - name: operation_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Recorded operation and current chain state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/L1OperationResponse"
        "404":
          description: Operation not found
        default:
          $ref: "#/components/responses/UnexpectedError"

  /session/claim:
    post:
      summary: Claim the single active writer lease
      operationId: claimSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionClaimRequest"
      responses:
        "200":
          description: Short-lived writer lease
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionClaimResponse"
        "409":
          description: Stale generation or conflicting writer

  /submit:
    post:
      summary: Submit transaction
      operationId: submitTransaction
      parameters:
        - $ref: "#/components/parameters/FerretSession"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitRequest"
      responses:
        "200":
          description: Transaction accepted by Koios submit endpoint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitResponse"
        default:
          $ref: "#/components/responses/UnexpectedError"

components:
  parameters:
    Address:
      name: address
      in: path
      required: true
      description: Shelley address encoded as bech32
      schema:
        type: string
        format: bech32
        minLength: 1
    TransactionId:
      name: id
      in: path
      required: true
      description: 32-byte transaction hash encoded as lowercase hexadecimal
      schema:
        type: string
        pattern: "^[0-9a-f]{64}$"
    FerretSession:
      name: FERRET-SESSION
      in: header
      required: true
      schema:
        type: string
        minLength: 32

  responses:
    UnexpectedError:
      description: Upstream failure or malformed request
      content:
        text/plain:
          schema:
            type: string
            example: unexpected error

  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    NetworkResponse:
      type: object
      required: [network]
      properties:
        network:
          type: string
          enum: [mainnet, preprod, preview]

    BalanceResponse:
      type: object
      required: [lovelace]
      additionalProperties: false
      properties:
        lovelace:
          type: string
          pattern: "^[0-9]+$"
          description: Lovelace amount encoded as a decimal string

    AssetObject:
      type: object
      required: [unit, quantity]
      additionalProperties: false
      properties:
        unit:
          type: string
          description: Asset identifier, or `lovelace` for Ada
        quantity:
          type: string
          pattern: "^[0-9]+$"
          description: Asset quantity encoded as a decimal string

    TxOutput:
      type: object
      required: [address, value]
      properties:
        address:
          type: string
        consumed_by:
          allOf:
            - $ref: "#/components/schemas/TxId"
            - description: Id of the transaction that consumed this output, if any.
        value:
          type: array
          items:
            $ref: "#/components/schemas/AssetObject"
        datum_hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
        datum_inline:
          type: string
          description: Inline datum CBOR encoded as hexadecimal
        reference_script_hash:
          type: string
          pattern: "^[0-9a-f]{56}$"

    TxId:
      type: string
      pattern: "^[0-9a-f]{64}$"

    TxInput:
      allOf:
        - $ref: "#/components/schemas/UtxoRef"
        - $ref: "#/components/schemas/TxOutput"

    UtxoRef:
      type: object
      required: [transaction_id, output_index]
      properties:
        transaction_id:
          $ref: "#/components/schemas/TxId"
        output_index:
          type: integer
          minimum: 0

    Utxo:
      allOf:
        - $ref: "#/components/schemas/UtxoRef"
        - $ref: "#/components/schemas/TxOutput"
        - type: object
          properties:
            reference_script_version:
              type: integer
              minimum: 0
              maximum: 3
            reference_script:
              type: string
              description: Reference script CBOR encoded as hexadecimal

    TransactionSummary:
      type: object
      required: [id, index, depth, timestamp, inputs, outputs]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/TxId"
        index:
          type: integer
          minimum: 0
        depth:
          type: integer
          minimum: 0
        timestamp:
          type: integer
          minimum: 0
          description: Block timestamp in Unix seconds
        invalid_before:
          type: integer
          minimum: 0
          description: Optional lower slot bound as returned by upstream
        invalid_after:
          type: integer
          minimum: 0
          description: Optional upper slot bound as returned by upstream
        inputs:
          type: array
          items:
            $ref: "#/components/schemas/TxInput"
        outputs:
          type: array
          items:
            $ref: "#/components/schemas/TxOutput"

    ProtocolParametersResponse:
      type: object
      additionalProperties: false
      required: [era, epoch, slot, payload]
      properties:
        era:
          type: string
        epoch:
          type: integer
          minimum: 0
        slot:
          type: integer
          minimum: 0
        payload:
          type: object

    SessionClaimRequest:
      type: object
      additionalProperties: false
      required:
        [
          walletVerificationKeyHex,
          generation,
          backupHashHex,
          devicePublicKeyHex,
          timestamp,
          signatureHex,
        ]
      properties:
        walletVerificationKeyHex:
          type: string
          pattern: "^[0-9a-f]{64}$"
        generation:
          type: integer
          minimum: 1
        backupHashHex:
          type: string
          pattern: "^[0-9a-f]{64}$"
        devicePublicKeyHex:
          type: string
          pattern: "^[0-9a-f]{64}$"
        timestamp:
          type: integer
          minimum: 0
        signatureHex:
          type: string
          pattern: "^[0-9a-f]{128}$"

    SessionClaimResponse:
      type: object
      additionalProperties: false
      required: [lease, expiresAtEpochMillis]
      properties:
        lease:
          type: string
        expiresAtEpochMillis:
          type: integer
          minimum: 0

    L1OperationRequest:
      type: object
      additionalProperties: false
      required: [operation_id, expected_transaction_id, transaction]
      properties:
        operation_id:
          type: string
          format: uuid
        expected_transaction_id:
          type: string
          pattern: "^[0-9a-f]{64}$"
        transaction:
          type: string
          pattern: "^[0-9a-f]+$"
          maxLength: 32768
          description: Signed transaction CBOR encoded as hexadecimal

    L1OperationResponse:
      type: object
      additionalProperties: false
      required: [operation_id, transaction_id, state]
      properties:
        operation_id:
          type: string
          format: uuid
        transaction_id:
          type: string
          pattern: "^[0-9a-f]{64}$"
        state:
          type: string
          enum: [pending, submitted, confirmed]

    SubmitRequest:
      type: object
      additionalProperties: false
      required: [operation_id, transaction]
      properties:
        operation_id:
          type: string
          format: uuid
        transaction:
          type: string
          description: Signed transaction CBOR encoded as hexadecimal

    SubmitResponse:
      type: object
      additionalProperties: false
      required: [transaction_id]
      properties:
        transaction_id:
          type: string
          pattern: "^[0-9a-f]{64}$"
