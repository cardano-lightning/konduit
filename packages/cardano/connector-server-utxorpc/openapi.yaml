openapi: 3.1.0
info:
  title: Cardano Connector Server API
  version: 1.0.0
  description: |
    Mainnet-only HTTP facade over Dolos (UTxO RPC) and a bounded Koios
    transaction history capability.
servers:
  - url: http://localhost:8787
    description: Local development server
paths:
  /:
    get:
      summary: API documentation
      operationId: getDocs
      responses:
        "200":
          description: HTML documentation
  /openapi.yaml:
    get:
      summary: OpenAPI document
      operationId: getOpenApi
      responses:
        "200":
          description: OpenAPI YAML
          content:
            application/yaml:
              schema:
                type: string
  /health:
    get:
      summary: Health
      operationId: getHealth
      responses:
        "200":
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /network:
    get:
      summary: Network
      operationId: getNetwork
      responses:
        "200":
          description: Fixed Mainnet identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkResponse"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /protocol-parameters:
    get:
      summary: Protocol parameters
      operationId: getProtocolParameters
      responses:
        "200":
          description: Live Bloxbean-compatible parameters from Dolos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtocolParametersResponse"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /balance/{address}:
    get:
      summary: Address balance
      operationId: getBalance
      parameters:
        - $ref: "#/components/parameters/Address"
      responses:
        "200":
          description: Lovelace balance for the address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceResponse"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /utxos_at/{address}:
    get:
      summary: UTxOs by address
      operationId: getUtxosAt
      parameters:
        - $ref: "#/components/parameters/Address"
      responses:
        "200":
          description: Current UTxOs found at the address
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Utxo"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /transactions/{address}:
    get:
      summary: Transactions by address
      operationId: getTransactions
      parameters:
        - $ref: "#/components/parameters/Address"
      responses:
        "200":
          description: Transactions touching the address
          content:
            application/json:
              schema:
                type: array
                maxItems: 1000
                items:
                  $ref: "#/components/schemas/TransactionSummary"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /transaction/{id}:
    get:
      summary: Transaction by id
      operationId: getTransaction
      parameters:
        - $ref: "#/components/parameters/TransactionId"
      responses:
        "200":
          description: Expanded transaction summary
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/TransactionSummary"
                  - type: "null"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /evaluate:
    post:
      summary: Evaluate a transaction without submitting it
      operationId: evaluateTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluateRequest"
      responses:
        "200":
          description: Node evaluation bound to the transaction body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationResponse"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /operations:
    post:
      summary: Create or reuse a durable L1 operation
      operationId: createOperation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOperationRequest"
      responses:
        "200":
          description: Operation state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResponse"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /operations/{operation_id}:
    get:
      summary: Get durable L1 operation
      operationId: getOperation
      parameters:
        - name: operation_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Operation state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResponse"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /internal/channel-operations:
    post:
      summary: Create or reuse an adaptor-authorized channel operation
      operationId: createChannelOperation
      security:
        - channelOperator: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOperationRequest"
      responses:
        "200":
          description: Operation state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResponse"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /internal/channel-operations/{operation_id}:
    get:
      summary: Get adaptor-authorized channel operation
      operationId: getChannelOperation
      security:
        - channelOperator: []
      parameters:
        - name: operation_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Operation state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResponse"
        default:
          $ref: "#/components/responses/UnexpectedError"
components:
  securitySchemes:
    channelOperator:
      type: http
      scheme: bearer
  parameters:
    Address:
      name: address
      in: path
      required: true
      description: Mainnet Shelley address encoded as bech32
      schema:
        type: string
        pattern: "^addr1[0-9a-z]+$"
        minLength: 58
        maxLength: 108
    TransactionId:
      name: id
      in: path
      required: true
      description: 32-byte transaction hash encoded as lowercase hexadecimal
      schema:
        type: string
        pattern: "^[0-9a-f]{64}$"
  responses:
    UnexpectedError:
      description: Upstream failure or malformed request
      content:
        text/plain:
          schema:
            type: string
            example: unexpected error
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    NetworkResponse:
      type: object
      additionalProperties: false
      required: [network]
      properties:
        network:
          type: string
          enum: [mainnet]
    ProtocolParametersResponse:
      type: object
      additionalProperties: false
      required: [era, epoch, slot, payload]
      properties:
        era:
          type: string
        epoch:
          type: integer
          minimum: 0
        slot:
          type: integer
          minimum: 0
        payload:
          $ref: "#/components/schemas/BloxbeanPayload"
    BloxbeanPayload:
      type: object
      additionalProperties: false
      required:
        - min_fee_a
        - min_fee_b
        - max_tx_size
        - key_deposit
        - pool_deposit
        - min_pool_cost
        - protocol_major_ver
        - protocol_minor_ver
        - coins_per_utxo_size
        - collateral_percent
        - max_collateral_inputs
        - price_mem
        - price_step
        - min_fee_ref_script_cost_per_byte
        - max_tx_ex_mem
        - max_tx_ex_steps
        - cost_models_raw
      properties:
        min_fee_a:
          type: integer
          minimum: 0
        min_fee_b:
          type: integer
          minimum: 0
        max_tx_size:
          type: integer
          minimum: 0
        key_deposit:
          type: string
          maxLength: 20
          pattern: "^[0-9]+$"
        pool_deposit:
          type: string
          maxLength: 20
          pattern: "^[0-9]+$"
        min_pool_cost:
          type: string
          maxLength: 20
          pattern: "^[0-9]+$"
        protocol_major_ver:
          type: integer
          minimum: 0
        protocol_minor_ver:
          type: integer
          minimum: 0
        coins_per_utxo_size:
          type: string
          pattern: "^[0-9]+$"
          maxLength: 20
        collateral_percent:
          type: integer
          minimum: 0
        max_collateral_inputs:
          type: integer
          minimum: 0
        price_mem:
          type: string
          pattern: "^(0|[1-9][0-9]*)(\\.[0-9]+)?$"
          maxLength: 64
        price_step:
          type: string
          pattern: "^(0|[1-9][0-9]*)(\\.[0-9]+)?$"
          maxLength: 64
        min_fee_ref_script_cost_per_byte:
          type: string
          pattern: "^(0|[1-9][0-9]*)(\\.[0-9]+)?$"
          maxLength: 64
        max_tx_ex_mem:
          type: string
          pattern: "^[1-9][0-9]{0,18}$"
          maxLength: 19
        max_tx_ex_steps:
          type: string
          pattern: "^[1-9][0-9]{0,18}$"
          maxLength: 19
        cost_models_raw:
          type: object
          additionalProperties: false
          required: [PlutusV3]
          properties:
            PlutusV1:
              type: array
              minItems: 1
              maxItems: 1024
              items:
                type: integer
                format: int64
            PlutusV2:
              type: array
              minItems: 1
              maxItems: 1024
              items:
                type: integer
                format: int64
            PlutusV3:
              type: array
              minItems: 1
              maxItems: 1024
              items:
                type: integer
                format: int64
    BalanceResponse:
      type: object
      required: [lovelace]
      additionalProperties: false
      properties:
        lovelace:
          type: string
          pattern: "^[0-9]+$"
          maxLength: 20
    AssetObject:
      type: object
      required: [unit, quantity]
      additionalProperties: false
      properties:
        unit:
          type: string
          pattern: "^(lovelace|[0-9a-f]{56}(?:[0-9a-f]{2}){0,32})$"
          maxLength: 120
        quantity:
          type: string
          pattern: "^[0-9]+$"
          maxLength: 20
    TxOutput:
      type: object
      additionalProperties: false
      required: [address, value]
      properties:
        address:
          type: string
          pattern: "^addr1[0-9a-z]+$"
          minLength: 58
          maxLength: 108
        consumed_by:
          $ref: "#/components/schemas/TxId"
        value:
          type: array
          minItems: 1
          maxItems: 10000
          items:
            $ref: "#/components/schemas/AssetObject"
        datum_hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
        datum_inline:
          type: string
          pattern: "^(?:[0-9a-f]{2})*$"
          maxLength: 131072
        reference_script_hash:
          type: string
          pattern: "^[0-9a-f]{56}$"
    TxId:
      type: string
      pattern: "^[0-9a-f]{64}$"
    TxInput:
      type: object
      additionalProperties: false
      required: [transaction_id, output_index, address, value]
      properties:
        transaction_id:
          $ref: "#/components/schemas/TxId"
        output_index:
          type: integer
          minimum: 0
        address:
          type: string
          pattern: "^addr1[0-9a-z]+$"
          minLength: 58
          maxLength: 108
        consumed_by:
          $ref: "#/components/schemas/TxId"
        value:
          type: array
          minItems: 1
          maxItems: 10000
          items:
            $ref: "#/components/schemas/AssetObject"
        datum_hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
        datum_inline:
          type: string
          pattern: "^(?:[0-9a-f]{2})*$"
          maxLength: 131072
        reference_script_hash:
          type: string
          pattern: "^[0-9a-f]{56}$"
    Utxo:
      type: object
      additionalProperties: false
      required: [transaction_id, output_index, address, value]
      properties:
        transaction_id:
          $ref: "#/components/schemas/TxId"
        output_index:
          type: integer
          minimum: 0
        address:
          type: string
          pattern: "^addr1[0-9a-z]+$"
          minLength: 58
          maxLength: 108
        consumed_by:
          $ref: "#/components/schemas/TxId"
        value:
          type: array
          minItems: 1
          maxItems: 10000
          items:
            $ref: "#/components/schemas/AssetObject"
        datum_hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
        datum_inline:
          type: string
          pattern: "^(?:[0-9a-f]{2})*$"
          maxLength: 131072
        reference_script_hash:
          type: string
          pattern: "^[0-9a-f]{56}$"
        reference_script_version:
          type: integer
          minimum: 0
          maximum: 3
        reference_script:
          type: string
          pattern: "^(?:[0-9a-f]{2})*$"
          maxLength: 131072
    TransactionSummary:
      type: object
      required: [id, index, depth, timestamp, inputs, outputs]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/TxId"
        index:
          type: integer
          minimum: 0
        depth:
          type: integer
          minimum: 0
        timestamp:
          type: integer
          minimum: 0
        invalid_before:
          type: integer
          minimum: 0
        invalid_after:
          type: integer
          minimum: 0
        inputs:
          type: array
          maxItems: 10000
          items:
            $ref: "#/components/schemas/TxInput"
        outputs:
          type: array
          maxItems: 10000
          items:
            $ref: "#/components/schemas/TxOutput"
    EvaluateRequest:
      type: object
      additionalProperties: false
      required: [transaction]
      properties:
        transaction:
          type: string
          pattern: "^(?:[0-9a-f]{2})+$"
          minLength: 2
          maxLength: 1048576
    EvaluationResponse:
      type: object
      additionalProperties: false
      required: [transaction_id, redeemers]
      properties:
        transaction_id:
          $ref: "#/components/schemas/TxId"
        redeemers:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/EvaluationRedeemer"
    EvaluationRedeemer:
      type: object
      additionalProperties: false
      required: [purpose, index, memory, steps]
      properties:
        purpose:
          type: string
          enum: [spend, mint, cert, reward, voting, proposing]
        index:
          type: integer
          minimum: 0
        memory:
          type: integer
          minimum: 0
        steps:
          type: integer
          minimum: 0
    CreateOperationRequest:
      type: object
      additionalProperties: false
      required: [operation_id, expected_transaction_id, transaction]
      properties:
        operation_id:
          type: string
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        expected_transaction_id:
          type: string
          pattern: "^[0-9a-f]{64}$"
        transaction:
          type: string
          pattern: "^(?:[0-9a-f]{2})+$"
          minLength: 2
          maxLength: 1048576
    OperationResponse:
      type: object
      additionalProperties: false
      required: [operation_id, expected_transaction_id, status, depth]
      properties:
        operation_id:
          type: string
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        expected_transaction_id:
          type: string
          pattern: "^[0-9a-f]{64}$"
        transaction_id:
          type: string
          pattern: "^[0-9a-f]{64}$"
        status:
          type: string
          enum: [pending, accepted, confirmed, settled, rejected]
        depth:
          type: integer
          minimum: 0
